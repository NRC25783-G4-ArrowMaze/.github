# .github/workflows/commitlint.yml
name: Lint Commits

on:
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-action@v6
        with:
          configFile: commitlint.config.js